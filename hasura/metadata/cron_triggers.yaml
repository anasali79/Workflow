- name: scheduled-workflow-trigger
  webhook: "{{ACTION_BASE_URL}}/scheduled-trigger"
  schedule: "*/15 * * * *"
  include_in_metadata: true
  payload: {}
  retry_conf:
    num_retries: 2
    tolerance_seconds: 21600
    retry_interval_seconds: 30
  headers:
    - name: Content-Type
      value: application/json
    - name: x-scheduled-secret
      value_from_env: SCHEDULED_TRIGGER_SECRET
  comment: >
    Fires every 15 minutes. The handler scans workflow_triggers rows of type
    'scheduled', evaluates cron expressions, and fires due triggers through
    the shared WorkflowEngine. SCHEDULED_TRIGGER_SECRET protects the endpoint.