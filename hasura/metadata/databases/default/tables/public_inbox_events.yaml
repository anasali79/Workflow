table:
  name: inbox_events
  schema: public
object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: organization_id
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - organization_id
        - payload
        - status
        - created_at
        - updated_at
        - event_type
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
