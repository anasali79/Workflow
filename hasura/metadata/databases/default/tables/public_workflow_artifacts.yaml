table:
  name: workflow_artifacts
  schema: public
object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: organization_id
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - organization_id
        - workflow_run_id
        - content
        - created_at
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
