table:
  name: org_members
  schema: public
object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: organization_id
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - organization_id
        - user_id
        - role
        - created_at
        - updated_at
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
insert_permissions:
  - role: user
    permission:
      columns:
        - organization_id
        - user_id
        - role
      # Allow user to add themselves to any org they just created (bootstrap).
      # Role is restricted to 'owner' only when user_id matches the inserting user.
      check:
        _and:
          - user_id:
              _eq: X-Hasura-User-Id
          - role:
              _in:
                - owner

update_permissions:
  - role: user
    permission:
      columns:
        - role
      filter:
        organization:
          org_members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: owner
      check:
        organization:
          org_members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: owner
delete_permissions:
  - role: user
    permission:
      filter:
        organization:
          org_members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: owner
