table:
  name: org_members
  schema: public
object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: organization_id
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - organization_id
        - user_id
        - role
        - created_at
        - updated_at
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
insert_permissions:
  - role: user
    permission:
      columns:
        - organization_id
        - user_id
        - role
      # Allows self-bootstrap as owner OR owner adding members to their org
      check:
        _or:
          - _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: owner
          - organization:
              org_members:
                _and:
                  - user_id:
                      _eq: X-Hasura-User-Id
                  - role:
                      _eq: owner
update_permissions:
  - role: user
    permission:
      columns:
        - role
      # Only org owners can update member roles
      filter:
        organization:
          org_members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: owner
      check:
        organization:
          org_members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: owner
delete_permissions:
  - role: user
    permission:
      # Only org owners can remove members from org
      filter:
        organization:
          org_members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: owner
