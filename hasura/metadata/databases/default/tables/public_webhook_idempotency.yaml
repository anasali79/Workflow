table:
  name: webhook_idempotency
  schema: public
object_relationships:
  - name: trigger
    using:
      foreign_key_constraint_on: trigger_id
  - name: workflow_run
    using:
      foreign_key_constraint_on: workflow_run_id
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - trigger_id
        - idempotency_key
        - workflow_run_id
        - created_at
      filter:
        trigger:
          workflow:
            organization:
              org_members:
                user_id:
                  _eq: X-Hasura-User-Id
