actions:
  - name: approveStep
    definition:
      kind: synchronous
      handler: http://localhost:1337/v1/functions/approve-step
      forward_client_headers: true
      headers:
        - name: x-internal-secret
          value: dev_internal_secret_key_12345
      timeout: 120
    permissions:
      - role: user
    comment: Approve a paused approval_gate step
  - name: triggerWorkflowRun
    definition:
      kind: synchronous
      handler: http://localhost:1337/v1/functions/trigger-workflow-run
      forward_client_headers: true
      headers:
        - name: x-internal-secret
          value: dev_internal_secret_key_12345
      timeout: 120
    permissions:
      - role: user
    comment: Start a workflow run (owner/editor)
custom_types:
  enums: []
  input_objects: []
  objects:
    - name: TriggerWorkflowRunOutput
    - name: ApproveStepOutput
  scalars: []
